<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실리콘 작업 앱</title>
    <!-- Pretendard 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <!-- Tailwind CSS 로드 및 토스 컬러 팔레트 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase 클라이언트 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            blueLight: '#E8F3FF',
                            bg: '#F2F4F6',
                            surface: '#FFFFFF',
                            text: '#191F28',
                            sub: '#4E5968',
                            placeholder: '#8B95A1',
                            border: '#E5E8EB',
                            red: '#F04452'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 기본 스크롤바 숨김 및 클릭 하이라이트 제거 */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #DEE2E6; /* 뷰포트가 넓을 때(가로모드/태블릿/PC) 앱 바깥 여백 배경 */
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 앱 전체를 모바일 폭으로 고정 + 중앙 정렬
           가로로 넓은 화면(가로모드, 태블릿, PC)에서도 카드/입력칸이 늘어지지 않도록 한다. */
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background-color: #F2F4F6;
            overflow-x: hidden;
        }
        @media (min-width: 481px) {
            .app-shell {
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
            }
        }

        /* 하단 고정 버튼바: 뷰포트 기준으로 계속 붙어있으면서(position:fixed),
           폭은 app-shell과 동일하게 제한 + 중앙 정렬 */
        .fixed-bottom-bar {
            left: 50%;
            transform: translateX(-50%);
            max-width: 480px;
        }

        /* SPA(Single Page Application) 화면 전환 스타일 */
        .page-view {
            display: none;
            width: 100%;
            min-height: 100vh;
        }
        .page-view.active {
            display: block;
            animation: fadeSlideIn 0.25s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 인풋 줌 방지 및 캘린더 아이콘 커스텀 */
        input, select, textarea { font-size: 16px !important; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }

        /* 숫자 입력칸 스피너 제거 (가운데 정렬 쏠림 방지) */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        .filter-chip { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="text-toss-text font-sans">
    <div id="appShell" class="app-shell">

    <!-- ============================================== -->
    <!-- 1. 리스트 화면 (목록 뷰) -->
    <!-- ============================================== -->
    <div id="listView" class="page-view active bg-toss-bg pb-[100px]">
        <header class="sticky top-0 bg-toss-bg/90 backdrop-blur-md z-40 px-5 pt-8 pb-2 flex justify-between items-center">
            <h1 class="text-[24px] font-bold text-toss-text tracking-tight">작업 내역</h1>
            <div class="flex items-center gap-2">
                <button type="button" onclick="openManageMenu()" class="w-10 h-10 flex items-center justify-center bg-white border border-toss-border rounded-full shadow-sm active:scale-95 transition-transform text-[18px] leading-none">⚙️</button>
                <button onclick="navigateTo('formView')" class="w-10 h-10 flex items-center justify-center bg-toss-blue rounded-full shadow-sm active:scale-95 transition-transform">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="sticky top-[72px] bg-toss-bg/90 backdrop-blur-md z-30 px-5 py-3 border-b border-toss-border/50">
            <div class="flex items-center justify-between gap-2">
                <div class="flex gap-2 overflow-x-auto hide-scrollbar whitespace-nowrap" id="filterContainer">
                    <button class="filter-chip bg-toss-text text-white px-4 py-2.5 rounded-[12px] text-[15px] font-semibold flex-shrink-0" data-filter="all">전체</button>
                    <button class="filter-chip bg-white text-toss-sub border border-toss-border px-4 py-2.5 rounded-[12px] text-[15px] font-semibold flex-shrink-0" data-filter="압출">압출</button>
                    <button class="filter-chip bg-white text-toss-sub border border-toss-border px-4 py-2.5 rounded-[12px] text-[15px] font-semibold flex-shrink-0" data-filter="프레스">프레스</button>
                    <button class="filter-chip bg-white text-toss-sub border border-toss-border px-4 py-2.5 rounded-[12px] text-[15px] font-semibold flex-shrink-0" data-filter="배합">배합</button>
                </div>
                <button type="button" id="selectModeToggleBtn" onclick="toggleSelectMode()" class="flex-shrink-0 text-[13px] text-toss-sub font-semibold active:opacity-70">선택</button>
            </div>
            <div id="searchBox" class="mt-3">
                <input type="text" id="searchInput" placeholder="업체명, 제품명, 메모 검색" class="w-full bg-white border border-toss-border text-toss-text placeholder-toss-placeholder rounded-xl p-3.5 focus:outline-none focus:bg-toss-blueLight transition-colors">
            </div>
        </div>

        <main class="px-5 py-4 space-y-4" id="logList">
            <div class="h-4"></div>
        </main>

        <!-- 하단 플로팅 버튼 (리스트 화면용) -->
        <div class="fixed bottom-0 w-full fixed-bottom-bar px-5 pt-4 bg-gradient-to-t from-toss-bg via-toss-bg/90 to-transparent z-50 pb-[calc(env(safe-area-inset-bottom,16px)+16px)] pointer-events-none" id="newRecordBar">
            <div class="pointer-events-auto">
                <button onclick="navigateTo('formView')"
                        class="w-full bg-toss-blue text-white text-[17px] font-bold py-[18px] rounded-[16px] shadow-[0_8px_20px_rgba(49,130,246,0.3)] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    새 작업 기록하기
                </button>
            </div>
        </div>

        <!-- 하단 삭제 바 (선택 모드용) -->
        <div class="fixed bottom-0 w-full fixed-bottom-bar px-5 pt-4 bg-gradient-to-t from-toss-bg via-toss-bg/90 to-transparent z-50 pb-[calc(env(safe-area-inset-bottom,16px)+16px)] pointer-events-none hidden" id="selectModeBar">
            <div class="pointer-events-auto flex gap-2">
                <button type="button" onclick="toggleSelectMode()" class="flex-shrink-0 bg-white border border-toss-border text-toss-text text-[17px] font-bold py-[18px] px-6 rounded-[16px] active:scale-[0.98] transition-transform">취소</button>
                <button type="button" id="deleteSelectedBtn" onclick="deleteSelectedLogs()" disabled
                        class="flex-1 bg-toss-red text-white text-[17px] font-bold py-[18px] rounded-[16px] shadow-[0_8px_20px_rgba(240,68,82,0.3)] active:scale-[0.98] transition-transform disabled:opacity-50">
                    삭제 (0)
                </button>
            </div>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- 2. 작업 기록 폼 화면 -->
    <!-- ============================================== -->
    <div id="formView" class="page-view bg-white pb-[100px]">
        
        <header class="sticky top-0 bg-white/90 backdrop-blur-md z-40 px-4 pt-6 pb-4 flex items-center gap-2">
            <button onclick="navigateTo('listView')" class="p-2 -ml-2 rounded-full active:bg-toss-bg transition-colors flex items-center justify-center">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 id="formHeaderTitle" class="text-[20px] font-bold text-toss-text">새 작업 기록</h1>
        </header>

        <main>
            <!-- 공정 단계 선택 (최상단) -->
            <section class="px-5 pt-4 pb-2">
                <div class="flex flex-col gap-2">
                    <label class="text-[14px] font-semibold text-toss-sub">공정 단계</label>
                    <div class="flex bg-toss-bg p-1 rounded-xl gap-1" id="processTabs">
                        <button type="button" class="segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-blue bg-white shadow-sm transition-all" data-value="압출">압출</button>
                        <button type="button" class="segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="프레스">프레스</button>
                        <button type="button" class="segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="배합">배합</button>
                    </div>
                    <input type="hidden" id="processStep" value="압출">
                </div>
            </section>

            <!-- 공통 입력: 작업 일시 -->
            <div id="commonTopGroup">
                <section class="px-5 py-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-[14px] font-semibold text-toss-sub">작업 일시</label>
                        <input type="datetime-local" id="workTime" class="w-full bg-toss-bg text-toss-text rounded-xl p-4 focus:outline-none transition-colors" readonly>
                        <p class="text-[12px] text-toss-placeholder">등록을 시작한 현재 시간으로 자동 저장됩니다.</p>
                    </div>
                </section>
            </div>

            <!-- 그룹 1: 압출 선택 시 렌더링 -->
            <div id="extrudeGroup">
                <div class="h-3 w-full bg-toss-bg"></div>
                <!-- 0. 배합정보 가져오기 -->
                <section class="px-5 py-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[18px] font-bold">배합 정보</h2>
                        <button type="button" onclick="openMixImportPicker()" class="text-[12px] text-toss-blue font-semibold active:opacity-70">배합정보 가져오기</button>
                    </div>
                    <div id="importedMixPreview">
                        <p class="text-[14px] text-toss-placeholder">이 제품에 사용된 원료 배합 기록이 있다면 가져와서 바로 확인할 수 있습니다.</p>
                    </div>
                </section>

                <div class="h-3 w-full bg-toss-bg"></div>
                <!-- 1. 제품 정보 -->
                <section class="px-5 py-6">
                    <h2 class="text-[18px] font-bold mb-5">제품 정보</h2>
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-2 relative">
                                <div class="flex items-center justify-between">
                                    <label class="text-[14px] font-semibold text-toss-sub">업체명</label>
                                    <button type="button" onclick="pickCompanyForForm()" class="text-[12px] text-toss-blue font-semibold active:opacity-70">거래처 관리</button>
                                </div>
                                <div class="relative">
                                    <input type="text" id="companyName" placeholder="업체명 입력" autocomplete="off" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 pr-[70px] focus:bg-toss-blueLight focus:outline-none transition-colors">
                                    <button type="button" id="companyAddBtn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 bg-toss-blue text-white text-[12px] font-semibold px-3 py-1.5 rounded-lg active:bg-blue-600 transition-colors whitespace-nowrap">+ 추가</button>
                                </div>
                                <div id="companySuggestions" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-toss-border rounded-xl shadow-lg z-20 max-h-[180px] overflow-y-auto"></div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-[14px] font-semibold text-toss-sub">제품명</label>
                                <input type="text" id="productName" placeholder="제품명 입력" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors">
                            </div>
                        </div>
                        
                        <!-- 제품 값 입력: 금형(내경/외경) / 제품(내경/외경/길이) 구분 -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <span class="text-[14px] font-semibold text-toss-sub block mb-1.5">금형</span>
                                <div class="grid grid-cols-2 gap-1.5">
                                    <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                                        <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">내경</label>
                                        <input type="number" id="moldInnerDia" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg p-0 text-center focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                    </div>
                                    <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                                        <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">외경</label>
                                        <input type="number" id="moldOuterDia" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg p-0 text-center focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                    </div>
                                </div>
                            </div>
                            <div>
                                <span class="text-[14px] font-semibold text-toss-sub block mb-1.5">제품</span>
                                <div class="grid grid-cols-3 gap-1.5">
                                    <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                                        <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">내경</label>
                                        <input type="number" id="innerDia" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg p-0 text-center focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                    </div>
                                    <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                                        <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">외경</label>
                                        <input type="number" id="outerDia" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg p-0 text-center focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                    </div>
                                    <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                                        <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">길이</label>
                                        <input type="number" id="lengthVal" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg p-0 text-center focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 수축률, 치수값 및 경도 선택 -->
                        <div class="grid grid-cols-2 gap-3 mt-3">
                            <div class="flex flex-col gap-2">
                                <label class="text-[14px] font-semibold text-toss-sub">수축률 (%)</label>
                                <input type="number" id="shrinkageRate" inputmode="decimal" placeholder="0" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors">
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-[14px] font-semibold text-toss-sub">치수값</label>
                                <input type="number" id="dimensionValue" inputmode="decimal" placeholder="0" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors">
                            </div>
                        </div>

                        <div class="flex flex-col gap-2 mt-3">
                            <label class="text-[14px] font-semibold text-toss-sub">경도</label>
                            <div class="flex bg-toss-bg p-1 rounded-xl gap-1">
                                <button type="button" class="hardness-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-blue bg-white shadow-sm transition-all" data-value="50">50</button>
                                <button type="button" class="hardness-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="60">60</button>
                                <button type="button" class="hardness-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="70">70</button>
                                <button type="button" class="hardness-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="direct">직접입력</button>
                            </div>
                            <input type="number" id="hardnessDirectInput" inputmode="decimal" placeholder="경도 직접 입력" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 mt-1 focus:bg-toss-blueLight focus:outline-none transition-colors" style="display: none;">
                            <input type="hidden" id="hardnessValue" value="50">
                        </div>
                    </div>
                </section>

                <div class="h-3 w-full bg-toss-bg"></div>
                <!-- 2. 설비 세팅 섹션 -->
                <section class="px-5 py-6">
                    <h2 class="text-[18px] font-bold mb-5">설비 세팅</h2>
                    <div class="space-y-6">
                        <div class="flex flex-col gap-2">
                            <label class="text-[14px] font-semibold text-toss-sub">사용 설비</label>
                            <div class="flex bg-toss-bg p-1 rounded-xl gap-1" id="extruderTabs">
                                <button type="button" class="extruder-segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-blue bg-white shadow-sm transition-all" data-value="압출기 1호">압출기 1호</button>
                                <button type="button" class="extruder-segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="압출기 2호">압출기 2호</button>
                                <button type="button" class="extruder-segment-btn flex-1 py-3 text-[15px] font-semibold rounded-[10px] text-toss-sub transition-all" data-value="압출기 3호">압출기 3호</button>
                            </div>
                            <input type="hidden" id="extruderType" value="압출기 1호">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-2">
                                <label class="text-[14px] font-semibold text-toss-sub">온도 (℃)</label>
                                <input type="number" id="extrudeTemp" inputmode="decimal" placeholder="0" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors">
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-[14px] font-semibold text-toss-sub">속도</label>
                                <input type="number" id="extrudeSpeed" inputmode="numeric" placeholder="0" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors">
                            </div>
                        </div>

                        <!-- 자동투입기계 세팅 -->
                        <div class="flex flex-col gap-2 pt-2">
                            <label class="text-[18px] font-bold text-toss-text">자동투입기계 세팅</label>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="flex flex-col gap-1.5">
                                    <label class="text-[12px] font-semibold text-toss-sub">투입속도</label>
                                    <input type="number" id="feedSpeed" inputmode="decimal" placeholder="0" class="w-full h-[44px] bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-lg px-3 focus:bg-toss-blueLight focus:outline-none transition-colors text-[14px]">
                                </div>
                                <div class="flex flex-col gap-1.5">
                                    <label class="text-[12px] font-semibold text-toss-sub">다량감속</label>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ===================== Supabase 연동 ===================== */
        const SUPABASE_URL = 'https://uzkdqitlyejsgqzcmlxw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6a2RxaXRseWVqc2dxemNtbHh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDMwMTksImV4cCI6MjEwMjkxOTAxOX0.JNFSFxR4eKdPIjexfIhYNBZcllk3Qf3xIurj0uHJclQ';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /* 화면 렌더링은 동기 함수(loadLogs 등)를 그대로 쓰던 기존 구조를 유지하기 위해
           Supabase에서 받아온 데이터를 아래 캐시 배열에 담아두고,
           refresh 함수로 캐시를 새로고침한 뒤 화면을 다시 그리는 방식을 사용한다. */
        const MATERIAL_BRANDS = ['대일', '어울림', 'KCC'];
        const MATERIAL_PURPOSES = ['몰딩', '압출', '기타'];

        let logsCache = [];
        let clientsCache = [];
        let materialsCache = [];
        let materialsFullCache = []; // {id, name, brand} 원자재 관리 화면(브랜드별 분류)용
        let additivesCache = [];

        function mapLogRow(row) {
            return {
                id: row.id,
                type: row.type,
                createdAt: row.created_at,
                title: row.title,
                subtitle: row.subtitle,
                images: row.images || [],
                memo: row.memo,
                detail: row.detail || {}
            };
        }

        async function refreshLogsCache() {
            const { data, error } = await sb.from('work_logs').select('*').is('deleted_at', null).order('created_at', { ascending: false });
            if (error) { console.error('작업 기록 불러오기 실패:', error); return false; }
            logsCache = (data || []).map(mapLogRow);
            return true;
        }

        async function fetchTrashedLogs() {
            const { data, error } = await sb.from('work_logs').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
            if (error) { console.error('휴지통 불러오기 실패:', error); return []; }
            return (data || []).map(mapLogRow);
        }

        async function refreshClientsCache() {
            const { data, error } = await sb.from('clients').select('*').order('name', { ascending: true });
            if (error) { console.error('거래처 불러오기 실패:', error); return false; }
            clientsCache = (data || []).map(row => row.name);
            return true;
        }

        async function refreshMaterialsCache() {
            const { data, error } = await sb.from('materials').select('*').order('brand', { ascending: true }).order('name', { ascending: true });
            if (error) { console.error('원자재 불러오기 실패:', error); return false; }
            materialsFullCache = data || [];
            materialsCache = [...new Set(materialsFullCache.map(row => row.name))];
            return true;
        }

        async function refreshAdditivesCache() {
            const { data, error } = await sb.from('additives').select('*').order('name', { ascending: true });
            if (error) { console.error('첨가제 불러오기 실패:', error); return false; }
            additivesCache = (data || []).map(row => row.name);
            return true;
        }

        function loadLogs() { return logsCache; }
        function loadClients() { return clientsCache; }
        function loadMaterials() { return materialsCache; }
        function loadMaterialsFull() { return materialsFullCache; }
        function loadAdditives() { return additivesCache; }

        /* ----- 거래처 관리 모달 ----- */
        /* 거래처 등록 공통 로직: 거래처 관리 팝업과 업체명 입력창의 빠른 추가 버튼이 함께 사용한다. */
        async function addClientToRegistry(name) {
            const trimmed = (name || '').trim();
            if (!trimmed) return { success: false };
            const { error } = await sb.from('clients').insert({ name: trimmed });
            if (error && error.code !== '23505') {
                return { success: false, error };
            }
            await refreshClientsCache();
            return { success: true };
        }

        /* ----- 관리 메뉴 (거래처 / 배합 / 휴지통) ----- */
        function openManageMenu() {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[150] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]';
            overlay.innerHTML = `
                <div class="bg-white w-full max-w-[360px] rounded-[24px] animate-[scaleUp_0.2s_ease-out] shadow-2xl overflow-hidden">
                    <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-toss-border">
                        <h3 class="text-[18px] font-bold">관리</h3>
                        <button id="manageMenuClose" class="w-9 h-9 flex items-center justify-center rounded-full active:bg-toss-bg transition-colors">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <div class="p-5 flex flex-col gap-2.5">
                        <button type="button" id="manageMenuClient" class="w-full bg-toss-bg text-toss-text text-[15px] font-semibold py-4 rounded-[14px] active:bg-toss-blueLight transition-colors">거래처</button>
                        <button type="button" id="manageMenuBlend" class="w-full bg-toss-bg text-toss-text text-[15px] font-semibold py-4 rounded-[14px] active:bg-toss-blueLight transition-colors">배합</button>
                        <button type="button" id="manageMenuTrash" class="w-full text-toss-red bg-red-50 text-[15px] font-semibold py-4 rounded-[14px] active:bg-red-100 transition-colors">휴지통</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';

            const closeMenu = () => { overlay.remove(); document.body.style.overflow = ''; };
            overlay.querySelector('#manageMenuClose').addEventListener('click', closeMenu);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMenu(); });
            overlay.querySelector('#manageMenuClient').addEventListener('click', () => { closeMenu(); openClientManager(); });
            overlay.querySelector('#manageMenuBlend').addEventListener('click', () => { closeMenu(); openBlendManagerChooser(); });
            overlay.querySelector('#manageMenuTrash').addEventListener('click', () => { closeMenu(); openTrashManager(); });
        }

        /* ----- 휴지통 (삭제한 작업 기록) ----- */
        function openTrashManager() {
            const overlay = document.createElement('div');

                    b.classList.toggle('shadow-sm', active);
                    b.classList.toggle('text-toss-blue', active);
                    b.classList.toggle('text-toss-sub', !active);
                });
                purposeCustomWrap.classList.toggle('hidden', selectedPurposeTab !== '기타');
            };
            const getSelectedPurpose = () => selectedPurposeTab === '기타' ? purposeCustomInput.value.trim() : selectedPurposeTab;

                b.addEventListener('click', () => {

                        alert('원자재 등록 실패: ' + error.message);

                renderMaterialList();
                refreshBlendChips('material');

                if (e.key === 'Enter') { e.preventDefault(); addMaterial(); }
            });

                        <div class="flex items-center gap-2 min-w-0">
                            ${selected ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3182F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
                            <span class="text-[15px] text-toss-text truncate">${name}</span>
                        </div>
                        <button type="button" class="additive-del-btn text-toss-red bg-red-50 w-8 h-8 rounded-full flex items-center justify-center active:bg-red-100 transition-colors flex-shrink-0" data-name="${name}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                `; }).join('');
                listArea.querySelectorAll('.additive-row').forEach(row => {
                    row.addEventListener('click', () => {
                        if (onSelect) {
                            onSelect(row.getAttribute('data-name'));
                            renderAdditiveList();
                            return;
                        }
                        newAdditiveInput.value = row.getAttribute('data-name');
                        newAdditiveInput.focus();
                    });
                });
                listArea.querySelectorAll('.additive-del-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const name = btn.getAttribute('data-name');
                        btn.disabled = true;
                        const { error } = await sb.from('additives').delete().eq('name', name);
                        if (error) { alert('첨가제 삭제 실패: ' + error.message); btn.disabled = false; return; }
                        await refreshAdditivesCache();
                        renderAdditiveList();
                        refreshBlendChips('additive');
                    });
                });
            };
            renderAdditiveList();
            const addAdditiveBtn = overlay.querySelector('#addAdditiveBtn');
            const addAdditiveName = async () => {
                const name = newAdditiveInput.value.trim();
                if (!name) return;
                addAdditiveBtn.disabled = true;
                const { error } = await sb.from('additives').insert({ name });
                addAdditiveBtn.disabled = false;
                if (error) {
                    if (error.code === '23505') {
                        newAdditiveInput.value = '';
                    } else {
                        alert('첨가제 등록 실패: ' + error.message);
                        return;
                    }
                } else {
                    newAdditiveInput.value = '';
                }
                await refreshAdditivesCache();
                renderAdditiveList();
                refreshBlendChips('additive');
                newAdditiveInput.focus();
            };
            addAdditiveBtn.addEventListener('click', addAdditiveName);
            newAdditiveInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addAdditiveName(); }
            });
        }

        /* ----- 업체명 자동완성 ----- */
        function setupCompanyAutocomplete(inputId, boxId, addBtnId) {
            const input = document.getElementById(inputId);
            const box = document.getElementById(boxId);
            const addBtn = addBtnId ? document.getElementById(addBtnId) : null;
            if (!input || !box) return;

            let matches = [];
            let activeIndex = -1;

            const hideBox = () => {
                box.classList.add('hidden');
                box.innerHTML = '';
                matches = [];
                activeIndex = -1;
            };

            const highlightActive = () => {
                box.querySelectorAll('.company-suggestion-item').forEach((el, i) => {
                    el.classList.toggle('bg-toss-bg', i === activeIndex);
                });
            };

            /* 등록된 거래처 중 지금 입력값과 정확히 일치하는 게 없으면(=새 거래처로 보이면)
               입력창 오른쪽에 "+ 추가" 버튼을 노출해 바로 등록할 수 있게 한다. */
            const updateAddBtn = () => {
                if (!addBtn) return;
                const val = input.value.trim();
                const exists = val && loadClients().some(c => c.toLowerCase() === val.toLowerCase());
                addBtn.classList.toggle('hidden', !val || exists);
            };

            const selectMatch = (idx) => {
                if (idx < 0 || idx >= matches.length) return false;
                input.value = matches[idx];
                hideBox();
                updateAddBtn();
                return true;
            };

            const showMatches = () => {
                updateAddBtn();
                const q = input.value.trim().toLowerCase();
                if (!q) { hideBox(); return; }
                matches = loadClients().filter(c => c.toLowerCase().includes(q));
                activeIndex = -1;
                if (matches.length === 0) { hideBox(); return; }
                box.innerHTML = matches.map(name => `
                    <button type="button" class="company-suggestion-item w-full text-left px-4 py-3 text-[15px] text-toss-text active:bg-toss-bg transition-colors" data-name="${name}">${name}</button>
                `).join('');
                box.classList.remove('hidden');
                box.querySelectorAll('.company-suggestion-item').forEach((item, i) => {
                    item.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        selectMatch(i);
                    });
                });
            };

            input.addEventListener('input', showMatches);
            input.addEventListener('focus', showMatches);
            input.addEventListener('blur', () => setTimeout(hideBox, 150));

            /* 자동완성 목록이 열려있을 때 ↓/↑로 이동, Tab 또는 Enter로 선택 확정 */
            input.addEventListener('keydown', (e) => {
                const visible = !box.classList.contains('hidden') && matches.length > 0;
                if (!visible) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % matches.length;
                    highlightActive();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + matches.length) % matches.length;
                    highlightActive();
                } else if (e.key === 'Enter') {
                    if (selectMatch(activeIndex >= 0 ? activeIndex : 0)) e.preventDefault();
                } else if (e.key === 'Tab') {
                    selectMatch(activeIndex >= 0 ? activeIndex : 0);
                } else if (e.key === 'Escape') {
                    hideBox();
                }
            });

            if (addBtn) {
                addBtn.addEventListener('click', async () => {
                    const name = input.value.trim();
                    if (!name) return;
                    addBtn.disabled = true;
                    const result = await addClientToRegistry(name);
                    addBtn.disabled = false;
                    if (!result.success) { alert('거래처 등록 실패: ' + (result.error ? result.error.message : '')); return; }
                    updateAddBtn();
                });
            }
        }

        /* ===================== 압출 ↔ 배합 상호 참조 (가져오기) =====================
           압출 작업 중엔 이 제품에 어떤 배합(원료 비율)을 썼는지 바로 확인하고,
           배합 작업 중엔 이 배합이 어떤 제품용인지 연결해둘 수 있게 한다. */
        let importedMixRef = null;

        function clearImportedMix() {
            importedMixRef = null;
            renderImportedMixPreview(null);
        }

        function renderImportedMixPreview(log) {
            const container = document.getElementById('importedMixPreview');
            if (!container) return;
            if (!log) {
                container.innerHTML = `<p class="text-[14px] text-toss-placeholder">이 제품에 사용된 원료 배합 기록이 있다면 가져와서 바로 확인할 수 있습니다.</p>`;
                return;
            }
            const d = log.detail || {};
            const productLine = [d.업체명, d.제품명].filter(Boolean).join(' ');

            let rows = '';
            if (d.원료 && d.원료.length > 0) {

                    <span class="text-[12px] font-semibold text-toss-sub">원료</span>

                        <div class="flex items-center justify-between text-[14px]">
                            <span class="text-toss-text">${esc(m.이름)}</span>
                            <span class="font-semibold text-toss-text">${esc(m.중량)}kg</span>
                        </div>
                    `).join('')}

                rows += `<div class="flex flex-col gap-1.5 mt-3">

                    ${d.첨가제.map(a => `
                        <div class="flex items-center justify-between text-[14px]">
                            <span class="text-toss-text">${esc(a.이름)}</span>
                            <span class="font-semibold text-toss-text">${esc(a.예상투입량)}g</span>

                <div class="bg-toss-bg rounded-xl p-4 flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <p class="text-[13px] text-toss-sub">${formatDateGroup(log.createdAt)} ${formatTime(log.createdAt)}${productLine ? ' · ' + productLine : ''}</p>
                        </div>
                        <button type="button" onclick="clearImportedMix()" class="text-toss-red text-[12px] font-semibold flex-shrink-0 active:opacity-70">해제</button>
                    </div>
                    ${rows}
                    <div class="flex justify-between items-center pt-2 border-t border-toss-border/60">
                        <span class="text-[13px] font-semibold text-toss-blue">총 원료 중량</span>
                        <span class="text-[14px] font-bold text-toss-blue">${esc(d.총원료중량)}kg</span>
                    </div>
                </div>
            `;
        }

        /* "(주)대일소재" vs "대일소재" 처럼 표기가 완전히 같지 않아도
           한쪽이 다른 쪽을 포함하면 같은 거래처로 취급한다. */
        function companyNamesMatch(a, b) {
            if (!a || !b) return false;
            const na = a.trim().toLowerCase();
            const nb = b.trim().toLowerCase();
            if (!na || !nb) return false;
            return na.includes(nb) || nb.includes(na);
        }

        async function openMixImportPicker() {
            await refreshLogsCache();
            const company = fieldVal('companyName');
            const product = fieldVal('productName');

            /* 업체명이 입력돼 있으면 그 업체와 연결된 배합만, 없으면 전체 배합을 보여준다.
               "(주)" 등 표기 차이로 정확히 똑같지 않아도 서로 포함관계면 같은 업체로 본다. */
            let mixLogs = loadLogs().filter(l => l.type === '배합');
            if (company) {
                mixLogs = mixLogs.filter(l => l.detail && l.detail.업체명 && companyNamesMatch(l.detail.업체명, company));
            }

            const scored = mixLogs.map(log => {
                const d = log.detail || {};
                const score = (product && d.제품명 === product) ? 1 : 0;
                return { log, score };
            }).sort((a, b) => b.score - a.score);

            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[150] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]';
            overlay.innerHTML = `
                <div class="bg-white w-full max-w-[420px] rounded-[24px] max-h-[80vh] flex flex-col animate-[scaleUp_0.2s_ease-out] shadow-2xl">
                    <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-toss-border">
                        <h3 class="text-[18px] font-bold">배합정보 가져오기</h3>
                        <button id="mixPickerClose" class="w-9 h-9 flex items-center justify-center rounded-full active:bg-toss-bg transition-colors">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <div class="overflow-y-auto px-5 py-3 hide-scrollbar flex-1" id="mixPickerList"></div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';
            const closePicker = () => { overlay.remove(); document.body.style.overflow = ''; };
            overlay.querySelector('#mixPickerClose').addEventListener('click', closePicker);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });

            const listArea = overlay.querySelector('#mixPickerList');
            if (scored.length === 0) {
                const emptyMsg = company ? `'${company}'와 연결된 배합 기록이 없습니다.` : '등록된 배합 기록이 없습니다.';
                listArea.innerHTML = `<p class="text-[14px] text-toss-placeholder text-center py-8">${esc(emptyMsg)}</p>`;
                return;
            }
            listArea.innerHTML = scored.map(({ log, score }) => {
                const d = log.detail || {};
                const productLine = [d.업체명, d.제품명].filter(Boolean).join(' ');
                return `
                    <button type="button" class="mix-picker-item w-full text-left py-3 border-b border-toss-border/50 last:border-0" data-id="${log.id}">
                        <div class="flex items-center gap-2 mb-1">
                            ${score > 0 ? `<span class="text-[11px] font-bold text-toss-blue bg-toss-blueLight px-2 py-0.5 rounded-[6px]">일치</span>` : ''}
                            <span class="text-[13px] text-toss-sub">${formatDateGroup(log.createdAt)} ${formatTime(log.createdAt)}</span>
                        </div>
                        <p class="text-[15px] font-semibold text-toss-text">${esc(log.title)}</p>
                        ${productLine ? `<p class="text-[13px] text-toss-sub">제품: ${productLine}</p>` : ''}
                        <p class="text-[13px] text-toss-sub">${esc(log.subtitle)}</p>
                    </button>
                `;
            }).join('');

            listArea.querySelectorAll('.mix-picker-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.getAttribute('data-id');
                    const log = loadLogs().find(l => l.id === id);
                    if (log) {
                        importedMixRef = log;
                        renderImportedMixPreview(log);
                    }
                    closePicker();
                });
            });
        }

        function clearMixProduct() {
            const companyEl = document.getElementById('mixCompanyName');
            const productEl = document.getElementById('mixProductName');
            if (companyEl) companyEl.value = '';
            if (productEl) productEl.value = '';
        }

        async function openProductImportPicker() {
            await refreshLogsCache();
            const extrudeLogs = loadLogs().filter(l => l.type === '압출');
            const seen = new Map();
            extrudeLogs.forEach(log => {
                const d = log.detail || {};
                const company = d.업체명 || '';
                const product = d.제품명 || '';
                if (!company && !product) return;
                const key = company + '|' + product;
                if (!seen.has(key)) seen.set(key, { company, product, latest: log, specs: new Set() });
                if (log.subtitle) seen.get(key).specs.add(log.subtitle);
            });
            const products = [...seen.values()].map(p => ({ ...p, specs: [...p.specs] }));

            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[150] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]';
            overlay.innerHTML = `
                <div class="bg-white w-full max-w-[420px] rounded-[24px] max-h-[80vh] flex flex-col animate-[scaleUp_0.2s_ease-out] shadow-2xl">
                    <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-toss-border">

                        <button id="productPickerClose" class="w-9 h-9 flex items-center justify-center rounded-full active:bg-toss-bg transition-colors">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <div class="px-5 pt-3 pb-2">
                        <input type="text" id="productPickerSearch" placeholder="업체명 또는 제품 스펙 검색" class="w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-3.5 focus:outline-none focus:bg-toss-blueLight transition-colors">
                    </div>
                    <div class="overflow-y-auto px-5 pb-3 hide-scrollbar flex-1" id="productPickerList"></div>

            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';
            const closePicker = () => { overlay.remove(); document.body.style.overflow = ''; };
            overlay.querySelector('#productPickerClose').addEventListener('click', closePicker);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });

            const listArea = overlay.querySelector('#productPickerList');

            const renderProductList = (query) => {
                const q = (query || '').trim().toLowerCase();

                        ${p.specs.length > 0 ? `<p class="text-[13px] text-toss-sub">스펙: ${esc(p.specs.join(', '))}</p>` : ''}
                        <p class="text-[13px] text-toss-sub">최근 사용: ${formatDateGroup(p.latest.createdAt)} ${formatTime(p.latest.createdAt)}</p>
                    </button>
                `).join('');

                listArea.querySelectorAll('.product-picker-item').forEach(item => {
                    item.addEventListener('click', () => {

                        document.getElementById('mixCompanyName').value = p.company;
                        document.getElementById('mixProductName').value = p.product;
                        closePicker();
                    });
                });
            };

            renderProductList('');
