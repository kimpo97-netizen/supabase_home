        /* ===================== 원료 / 첨가제 다중 선택 + 비율(%) ===================== *
         * 등록된 항목을 버튼(칩)으로 여러 개 토글 선택할 수 있고, "+ 직접입력"으로
         * 등록되지 않은 이름도 여러 개 추가할 수 있다.
         * 선택된 항목이 1개면 절대 중량(원료: kg, 첨가제: g) 입력 1칸,
         * 2개 이상이면 항목별 비율(%) 입력이 자동 생성된다. */
        const blendState = {
            material: { selected: new Set(), custom: [], values: {} },
            additive: { selected: new Set(), custom: [], values: {} }
        };

        let materialBrandFilter = MATERIAL_BRANDS[0];

        function blendConfig(kind) {
            return kind === 'material'
                ? {
                    chipsId: 'materialChips',
                    customListId: 'materialCustomList',
                    valuesId: 'materialValueInputs',
                    registryLoader: () => loadMaterialsFull().filter(row => row.brand === materialBrandFilter).map(row => row.name),
                    singleUnit: 'kg',
                    customPlaceholder: '원료명 직접 입력',
                    emptyMsg: `등록된 ${materialBrandFilter} 원자재가 없습니다. 원자재 관리에서 먼저 추가해주세요.`
                }
                : {
                    chipsId: 'additiveChips',
                    customListId: 'additiveCustomList',
                    valuesId: 'additiveValueInputs',
                    registryLoader: loadAdditives,
                    singleUnit: 'g',
                    customPlaceholder: '첨가제/안료명 직접 입력',
                    emptyMsg: '등록된 첨가제가 없습니다. 첨가제 관리에서 먼저 추가해주세요.'
                };
        }

        function getBlendItemNames(kind) {
            const state = blendState[kind];
            const names = [...state.selected];
            state.custom.forEach(c => { if (c.trim()) names.push(c.trim()); });
            return names;
        }

        function renderBlendChips(kind) {
            const cfg = blendConfig(kind);
            const state = blendState[kind];
            const container = document.getElementById(cfg.chipsId);
            if (!container) return;
            const items = cfg.registryLoader();

            let html = items.map(name => `
                <button type="button" class="blend-chip px-4 py-2.5 rounded-[12px] text-[14px] font-semibold border transition-all ${state.selected.has(name) ? 'bg-toss-blue text-white border-toss-blue' : 'bg-toss-bg text-toss-sub border-transparent'}" data-value="${name}">${name}</button>
            `).join('');
            if (items.length === 0) {
                html = `<p class="text-[13px] text-toss-placeholder w-full">${cfg.emptyMsg}</p>` + html;
            }
            container.innerHTML = html;

            container.querySelectorAll('.blend-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const name = chip.getAttribute('data-value');
                    if (state.selected.has(name)) state.selected.delete(name);
                    else state.selected.add(name);
                    renderBlendChips(kind);
                    renderBlendValues(kind);
                });
            });
        }

        function renderBlendCustomList(kind) {
            const cfg = blendConfig(kind);
            const state = blendState[kind];
            const container = document.getElementById(cfg.customListId);
            if (!container) return;

            container.innerHTML = state.custom.map((val, i) => `
                <div class="flex gap-2 items-center">
                    <input type="text" class="blend-custom-input flex-1 bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-4 focus:bg-toss-blueLight focus:outline-none transition-colors" placeholder="${cfg.customPlaceholder}" data-index="${i}" value="${val.replace(/"/g, '&quot;')}">
                    <button type="button" class="blend-custom-del-btn text-toss-red bg-red-50 w-10 h-10 rounded-full flex items-center justify-center active:bg-red-100 transition-colors flex-shrink-0" data-index="${i}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            `).join('');

            container.querySelectorAll('.blend-custom-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    state.custom[idx] = e.target.value;
                    renderBlendValues(kind);
                });
            });
            container.querySelectorAll('.blend-custom-del-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.getAttribute('data-index'), 10);
                    state.custom.splice(idx, 1);
                    renderBlendCustomList(kind);
                    renderBlendValues(kind);
                });
            });
        }

        /* 원료: 선택된 항목마다 중량(kg) 입력. 여러 개면 항목별로, 합은 상단 "총 OOkg" 배지에 반영.
           첨가제: 절대 중량이 아니라 "원료 1kg당 투입되는 g(투입 비율)"을 입력받아,
           원료 총중량 기준 실제 투입해야 할 g을 자동 계산해 함께 보여준다. */
        function renderBlendValues(kind) {
            const cfg = blendConfig(kind);
            const state = blendState[kind];
            const container = document.getElementById(cfg.valuesId);
            if (!container) return;
            const names = getBlendItemNames(kind);

            if (names.length === 0) {
                container.innerHTML = '';
            } else if (kind === 'material') {
                const rows = names.map(name => `
                    <div class="flex items-center gap-3">
                        <div class="flex-1 bg-toss-bg text-toss-text rounded-xl px-4 py-3.5 text-[14px] truncate">${name}</div>
                        <div class="relative w-[110px] flex-shrink-0">
                            <input type="number" inputmode="decimal" placeholder="0" class="blend-value-input w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-3 pr-8 text-[14px] text-right focus:bg-toss-blueLight focus:outline-none transition-colors" data-name="${name}" value="${state.values[name] || ''}">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[13px] text-toss-placeholder pointer-events-none">kg</span>
                        </div>
                    </div>
                `).join('');
                container.innerHTML = `<div class="flex flex-col gap-2">${rows}</div>`;
            } else {
                const rows = names.map(name => `
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-3">
                            <div class="flex-1 bg-toss-bg text-toss-text rounded-xl px-4 py-3.5 text-[14px] truncate">${name}</div>
                            <div class="relative w-[110px] flex-shrink-0">
                                <input type="number" inputmode="decimal" placeholder="0" class="blend-value-input w-full bg-toss-bg text-toss-text placeholder-toss-placeholder rounded-xl p-3 pr-10 text-[14px] text-right focus:bg-toss-blueLight focus:outline-none transition-colors" data-name="${name}" value="${state.values[name] || ''}">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] text-toss-placeholder pointer-events-none">g/kg</span>
                            </div>
                        </div>
                        <p class="text-[12px] text-toss-placeholder text-right">예상 투입량 <span class="additive-computed font-semibold text-toss-sub" data-name="${name}">0</span>g</p>
                    </div>
                `).join('');
                container.innerHTML = `<div class="flex flex-col gap-3">${rows}</div>`;
            }

            container.querySelectorAll('.blend-value-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const name = e.target.getAttribute('data-name');
                    state.values[name] = e.target.value;
                    if (kind === 'material') { updateMaterialTotal(); updateAdditiveComputed(); }
                    else { updateAdditiveComputed(); }
                });
            });

            if (kind === 'material') {
                updateMaterialTotal();
                updateAdditiveComputed();
            } else {
                updateAdditiveComputed();
            }
        }

        function getTotalMaterialKg() {
            let sum = 0;
            Object.values(blendState.material.values || {}).forEach(v => {
                const n = parseFloat(v);
                if (!isNaN(n)) sum += n;
            });
            return Math.round(sum * 1000) / 1000;
        }

        function updateMaterialTotal() {
            const totalEl = document.getElementById('totalWeight');
            if (totalEl) totalEl.textContent = getTotalMaterialKg();
        }

        function updateAdditiveComputed() {
            const totalKg = getTotalMaterialKg();
            document.querySelectorAll('.additive-computed').forEach(el => {
                const name = el.getAttribute('data-name');
                const dose = parseFloat(blendState.additive.values[name]);
                const total = !isNaN(dose) ? dose * totalKg : 0;
                el.textContent = Math.round(total * 100) / 100;
            });
        }

        function refreshBlendChips(kind) {
            renderBlendChips(kind);
        }

        function resetBlend(kind, defaultCustomCount) {
            blendState[kind] = { selected: new Set(), custom: new Array(defaultCustomCount || 0).fill(''), values: {} };
            renderBlendChips(kind);
            renderBlendCustomList(kind);
            renderBlendValues(kind);
        }

        function formatTime(iso) {
            const d = new Date(iso);
            let h = d.getHours();
            const m = d.getMinutes();
            const ampm = h < 12 ? '오전' : '오후';
            h = h % 12;
            if (h === 0) h = 12;
            return `${ampm} ${h}:${String(m).padStart(2, '0')}`;
        }

        function formatDateGroup(iso) {
            const d = new Date(iso);
            const now = new Date();
            const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const nOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.round((nOnly - dOnly) / 86400000);
            if (diffDays === 0) return '오늘';
            if (diffDays === 1) return '어제';
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        const typeStyleMap = {
            '압출': { badge: 'text-[#00B98D] bg-[#E5F7F2]' },
            '배합': { badge: 'text-toss-blue bg-toss-blueLight' },
            '프레스': { badge: 'text-[#6B7684] bg-[#F2F4F6]' }
        };

        const placeholderIconSvg = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;

        let currentFilter = 'all';
        let currentSearch = '';
        let logsLoaded = false;
        let selectMode = false;
        let selectedLogIds = new Set();

        function toggleSelectMode() {
            selectMode = !selectMode;
            if (!selectMode) selectedLogIds.clear();
            updateSelectModeUI();
            renderList();
        }

        function updateSelectModeUI() {
            const toggleBtn = document.getElementById('selectModeToggleBtn');
            if (toggleBtn) toggleBtn.textContent = selectMode ? '취소' : '선택';
            const newRecordBar = document.getElementById('newRecordBar');
            const selectBar = document.getElementById('selectModeBar');
            if (newRecordBar) newRecordBar.classList.toggle('hidden', selectMode);
            if (selectBar) selectBar.classList.toggle('hidden', !selectMode);
            const deleteBtn = document.getElementById('deleteSelectedBtn');
            if (deleteBtn) {
                deleteBtn.textContent = `삭제 (${selectedLogIds.size})`;
                deleteBtn.disabled = selectedLogIds.size === 0;
            }
        }

        function toggleLogSelection(logId) {
            if (selectedLogIds.has(logId)) selectedLogIds.delete(logId);
            else selectedLogIds.add(logId);
            updateSelectModeUI();
            renderList();
        }

        async function deleteSelectedLogs() {
            if (selectedLogIds.size === 0) return;
            const ids = [...selectedLogIds];
            const deleteBtn = document.getElementById('deleteSelectedBtn');
            if (deleteBtn) deleteBtn.disabled = true;
            const { error } = await sb.from('work_logs').update({ deleted_at: new Date().toISOString() }).in('id', ids);
            if (error) {
                alert('삭제 실패: ' + error.message);
                if (deleteBtn) deleteBtn.disabled = false;
                return;
            }
            selectedLogIds.clear();
            selectMode = false;
            updateSelectModeUI();
            await refreshLogsCache();
            renderList();
        }

        function renderList() {
            const logList = document.getElementById('logList');
            const logs = loadLogs().slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            const filtered = logs.filter(log => {
                if (currentFilter !== 'all' && log.type !== currentFilter) return false;
                if (currentSearch) {
                    const d = log.detail || {};
                    const haystack = `${log.title} ${log.subtitle} ${log.memo || ''} ${d.업체명 || ''} ${d.제품명 || ''}`.toLowerCase();
                    if (!haystack.includes(currentSearch.toLowerCase())) return false;
                }
                return true;
            });

            logList.innerHTML = '';

            if (filtered.length === 0) {
                const message = logsLoaded ? '표시할 작업 기록이 없습니다.' : '불러오는 중입니다...';
                logList.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 text-center">
                        <p class="text-[15px] text-toss-placeholder font-medium">${message}</p>
                    </div>
                `;
                return;
            }

            let lastGroup = null;
            filtered.forEach(log => {
                const group = formatDateGroup(log.createdAt);
                if (group !== lastGroup) {
                    const groupEl = document.createElement('div');
                    groupEl.className = 'pt-2 pb-1';
                    groupEl.innerHTML = `<span class="text-[13px] font-semibold text-toss-placeholder">${group}</span>`;
                    logList.appendChild(groupEl);
                    lastGroup = group;
                }

                const style = typeStyleMap[log.type] || typeStyleMap['프레스'];
                const isSelected = selectedLogIds.has(log.id);
                const item = document.createElement('div');
                item.className = `log-item relative bg-white p-5 rounded-[20px] shadow-sm active:scale-[0.98] transition-transform cursor-pointer ${selectMode && isSelected ? 'ring-2 ring-toss-blue' : ''}`;
                item.setAttribute('data-type', log.type);

                const thumb = log.images && log.images.length > 0
                    ? `<img src="${log.images[0]}" alt="작업사진" class="w-full h-full object-cover cursor-pointer log-thumb">`
                    : `<div class="w-full h-full flex items-center justify-center text-toss-placeholder">${placeholderIconSvg}</div>`;

                const selectCircle = selectMode ? `
                    <div class="absolute top-3 right-3 w-6 h-6 rounded-full border-2 flex items-center justify-center z-10 transition-colors ${isSelected ? 'bg-toss-blue border-toss-blue' : 'bg-white border-toss-border'}">
                        ${isSelected ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
                    </div>
                ` : '';

                item.innerHTML = `
                    ${selectCircle}
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-[13px] font-bold ${style.badge} px-2.5 py-1 rounded-[8px]">${log.type}</span>
                            <span class="text-[14px] font-medium text-toss-sub">${formatTime(log.createdAt)}</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center gap-4">
                        <div class="flex-1">
                            <h3 class="text-[17px] font-bold text-toss-text mb-1 tracking-tight">${log.title}</h3>
                            <p class="text-[14px] text-toss-sub">${log.subtitle}</p>
                        </div>
                        <div class="w-[60px] h-[60px] rounded-[14px] bg-toss-bg border border-toss-border overflow-hidden flex-shrink-0">
                            ${thumb}
                        </div>
                    </div>
                `;

                const thumbImg = item.querySelector('.log-thumb');
                if (thumbImg) {
                    thumbImg.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (selectMode) toggleLogSelection(log.id);
                        else openLightbox(log.images);
                    });
                }

                item.addEventListener('click', () => {
                    if (selectMode) toggleLogSelection(log.id);
                    else openDetailView(log.id);
                });

                logList.appendChild(item);
            });
        }

        /* fadeSlideIn 애니메이션은 forwards로 끝나서 종료 후에도 transform이 남는데,
           이 transform이 하위의 position:fixed 하단 버튼바 기준점을 뷰포트가 아닌
           이 요소로 바꿔버려 스크롤 시 버튼이 화면 밖으로 사라지는 문제가 있었다.
           애니메이션이 끝나면 transform을 제거해 원래(뷰포트 기준) 동작으로 되돌린다. */
        document.querySelectorAll('.page-view').forEach(pv => {
            pv.addEventListener('animationend', (e) => {
                if (e.animationName === 'fadeSlideIn') {
                    /* animation-fill-mode: forwards로 유지된 transform은 일반 인라인 스타일보다
                       우선순위가 높아 style.transform만으로는 지워지지 않는다.
                       애니메이션 자체를 해제해야 남아있던 transform이 완전히 사라진다. */
                    pv.style.animation = 'none';
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value.trim();
                    renderList();
                });
            }

            const filterBtns = document.querySelectorAll('.filter-chip');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-toss-text', 'text-white');
                        b.classList.add('bg-white', 'text-toss-sub', 'border', 'border-toss-border');
                    });
                    e.currentTarget.classList.remove('bg-white', 'text-toss-sub', 'border', 'border-toss-border');
                    e.currentTarget.classList.add('bg-toss-text', 'text-white');

                    currentFilter = e.currentTarget.getAttribute('data-filter');
                    renderList();
                });
            });

            renderList();

            setupCompanyAutocomplete('companyName', 'companySuggestions', 'companyAddBtn');
            setupCompanyAutocomplete('mixCompanyName', 'mixCompanySuggestions');
            resetBlend('material', 0);
            resetBlend('additive', 0);

            /* Supabase에서 초기 데이터 로드 후 화면 갱신 */
            Promise.all([refreshLogsCache(), refreshClientsCache(), refreshMaterialsCache(), refreshAdditivesCache()]).then(() => {
                logsLoaded = true;
                renderList();
                refreshBlendChips('material');
                refreshBlendChips('additive');
            });
        });

        /* ===================== 사진 확대보기 (라이트박스) ===================== */
        function openLightbox(images, startIndex) {
            if (!images || images.length === 0) return;
            let idx = startIndex || 0;

            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[200] bg-black/90 animate-[fadeIn_0.2s_ease-out]';
            overlay.innerHTML = `
                <button id="lightboxClose" class="absolute top-6 right-5 z-10 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div id="lightboxViewport" class="w-full h-full flex items-center justify-center overflow-auto hide-scrollbar" style="touch-action: pan-x pan-y;">
                    <img id="lightboxImg" src="${images[idx]}" class="max-w-[92vw] max-h-[80vh] object-contain rounded-lg select-none cursor-zoom-in" draggable="false">
                </div>
                <p class="absolute bottom-5 left-1/2 -translate-x-1/2 text-[12px] text-white/60 pointer-events-none">더블탭하여 확대</p>
                ${images.length > 1 ? `
                <button id="lightboxPrev" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="lightboxNext" class="absolute right-3 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>` : ''}
            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';

            const imgEl = overlay.querySelector('#lightboxImg');
            const viewport = overlay.querySelector('#lightboxViewport');
            let zoomed = false;

            const setZoom = (on, clientX, clientY) => {
                zoomed = on;
                if (on) {
                    imgEl.style.maxWidth = 'none';
                    imgEl.style.maxHeight = 'none';
                    imgEl.style.width = '220%';
                    imgEl.classList.remove('cursor-zoom-in');
                    imgEl.classList.add('cursor-zoom-out');
                    requestAnimationFrame(() => {
                        const vpRect = viewport.getBoundingClientRect();
                        const relX = clientX != null ? (clientX - vpRect.left) / vpRect.width : 0.5;
                        const relY = clientY != null ? (clientY - vpRect.top) / vpRect.height : 0.5;
                        viewport.scrollLeft = imgEl.offsetWidth * relX - vpRect.width / 2;
                        viewport.scrollTop = imgEl.offsetHeight * relY - vpRect.height / 2;
                    });
                } else {
                    imgEl.style.maxWidth = '';
                    imgEl.style.maxHeight = '';
                    imgEl.style.width = '';
                    imgEl.classList.remove('cursor-zoom-out');
                    imgEl.classList.add('cursor-zoom-in');
                    viewport.scrollLeft = 0;
                    viewport.scrollTop = 0;
                }
            };

            let lastTap = 0;
            imgEl.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                setZoom(!zoomed, e.clientX, e.clientY);
            });
            imgEl.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    e.preventDefault();
                    e.stopPropagation();
                    const t = e.changedTouches[0];
                    setZoom(!zoomed, t.clientX, t.clientY);
                }
                lastTap = now;
            });

            const closeLightbox = () => {
                overlay.remove();
                document.body.style.overflow = '';
            };

            overlay.querySelector('#lightboxClose').addEventListener('click', closeLightbox);
            viewport.addEventListener('click', (e) => {
                if (e.target === viewport) closeLightbox();
            });

            const prevBtn = overlay.querySelector('#lightboxPrev');
            const nextBtn = overlay.querySelector('#lightboxNext');
            if (prevBtn) prevBtn.addEventListener('click', () => {
                idx = (idx - 1 + images.length) % images.length;
                imgEl.src = images[idx];
                setZoom(false);
            });
            if (nextBtn) nextBtn.addEventListener('click', () => {
                idx = (idx + 1) % images.length;
                imgEl.src = images[idx];
                setZoom(false);
            });
        }

        /* ===================== 작업 기록 상세보기 ===================== */
        function esc(v) {
            if (v === undefined || v === null || v === '') return '-';
            return String(v);
        }

        function detailField(label, value, showLabel = true) {
            return `
                <div class="flex flex-col gap-2">
                    ${showLabel ? `<label class="text-[14px] font-semibold text-toss-sub">${label}</label>` : ''}
                    <div class="w-full bg-toss-bg text-toss-text rounded-xl p-4 min-h-[52px] flex items-center">${esc(value)}</div>
                </div>
            `;
        }

        function detailFieldSmall(label, value) {
            return `
                <div class="flex flex-col items-center justify-center gap-1.5 w-full">
                    <label class="text-[11px] font-semibold text-toss-sub text-center tracking-tighter whitespace-nowrap w-full block">${label}</label>
                    <div class="w-full h-[44px] bg-toss-bg text-toss-text rounded-lg flex items-center justify-center text-[14px]">${esc(value)}</div>
                </div>
            `;
        }

        function buildDetailSections(log) {
            const d = log.detail || {};
            let sections = '';

            if (log.type === '압출') {
                /* 저장 시점에 "가져오기"로 명시적으로 연결해둔 배합이 있으면 그걸 쓰고,
                   없으면 지금 이 제품(업체명+제품명)과 일치하는 배합 기록을 그때그때 찾아서 보여준다.
                   (배합 작업을 압출 기록보다 나중에 만들었거나, 가져오기를 누르지 않은 경우까지 커버)
                   맨 위에 배치하고 기본은 접힌 상태의 더보기/접기 형식으로 보여준다. */
                let refMixList = d.참고배합 ? [d.참고배합] : [];
                if (refMixList.length === 0 && (d.업체명 || d.제품명)) {
                    refMixList = loadLogs()
                        .filter(l => l.type === '배합' && l.detail && (
                            (d.업체명 && companyNamesMatch(l.detail.업체명, d.업체명) && d.제품명 && l.detail.제품명 === d.제품명)
                        ))
                        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                        .map(l => Object.assign({}, l.detail, { _createdAt: l.createdAt }));
                }

                if (refMixList.length > 0) {
                    let refMixInner = '';
                    refMixList.forEach(rm => {
                        refMixInner += `<div class="space-y-3 pb-5 border-b border-toss-border/50 last:border-0 last:pb-0">`;

                        ${(log.images && log.images.length > 0) || log.memo ? `

                            ` : ''}
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';

            const closeDetail = () => {
                overlay.remove();
                document.body.style.overflow = '';

            overlay.querySelector('#detailCloseBtn').addEventListener('click', closeDetail);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeDetail();

            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    closeDetail();
                    navigateTo('formView', log);
                });

                refMixToggleBtn.addEventListener('click', () => {

                    const icon = overlay.querySelector('#refMixToggleIcon');

        let editingLogId = null;

        function navigateTo(pageId, editLog) {
            if (pageId !== 'listView' && selectMode) {
                selectMode = false;
                selectedLogIds.clear();
                updateSelectModeUI();
            }

            document.querySelectorAll('.page-view').forEach(page => {
                page.classList.remove('active');
            });

            const targetPage = document.getElementById(pageId);
            targetPage.style.animation = ''; /* 이전 방문에서 남긴 animation:none 해제 → 진입 애니메이션 재생 */
            targetPage.classList.add('active');
            window.scrollTo(0, 0);

            if (pageId === 'formView') {
                editingLogId = editLog ? editLog.id : null;

                const baseDate = editLog ? new Date(editLog.createdAt) : new Date();
                baseDate.setMinutes(baseDate.getMinutes() - baseDate.getTimezoneOffset());
                document.getElementById('workTime').value = baseDate.toISOString().slice(0, 16);

                const targetType = editLog ? editLog.type : '압출';
                const targetTab = document.querySelector(`#processTabs button[data-value="${targetType}"]`);
                if (targetTab) targetTab.click();

                resetForm();

                if (editLog) {
                    populateFormFromLog(editLog);
                }

                const formTitleEl = document.getElementById('formHeaderTitle');
                if (formTitleEl) formTitleEl.textContent = editLog ? '작업 기록 수정' : '새 작업 기록';
                const submitBtnEl = document.getElementById('submitLogBtn');
                if (submitBtnEl) submitBtnEl.textContent = editLog ? '수정 완료' : '기록 저장하기';

                /* 거래처/원자재 목록을 최신 상태로 백그라운드에서 새로고침 */
                Promise.all([refreshClientsCache(), refreshMaterialsCache(), refreshAdditivesCache()]).then(() => {
                    refreshBlendChips('material');
                    refreshBlendChips('additive');
                });
            } else if (pageId === 'listView') {
                editingLogId = null;
                renderList();
                /* 다른 기기에서 등록한 최신 작업 기록을 백그라운드에서 불러와 갱신 */
                refreshLogsCache().then(() => {
                    logsLoaded = true;
                    renderList();
                });
            }
        }

            delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            delBtn.onclick = function(ev) {
                ev.stopPropagation();
                const idx = capturedImages.indexOf(dataUrl);
                if (idx > -1) capturedImages.splice(idx, 1);
                wrap.remove();
            };

            wrap.appendChild(img);
            wrap.appendChild(delBtn);
            imageGallery.appendChild(wrap);
        }

        cameraInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.match('image.*')) continue;

                const reader = new FileReader();
                reader.onload = (function(e) {
                    addImageToGallery(e.target.result);
                });
                reader.readAsDataURL(file);
            }
            cameraInput.value = '';
        });

        function resetForm() {
            capturedImages = [];
            imageGallery.innerHTML = '';
            const memo = document.getElementById('workMemo');
            if (memo) memo.value = '';

            ['companyName', 'productName', 'moldInnerDia', 'innerDia', 'moldOuterDia', 'outerDia',
             'lengthVal', 'shrinkageRate', 'dimensionValue', 'extrudeTemp', 'extrudeSpeed',
             'feedSpeed', 'feedDecel', 'feedReverse', 'feedSingleSpeed',
             'cutSetLength', 'cutBackSpeed', 'cutRollerPress', 'cutHotHandling',
             'jigSize', 'jigLengthSetting', 'jigPercent', 'jigPress', 'manualCutLength'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });

            /* 버튼식 선택 항목들을 기본값으로 되돌린다 (편집 후 새 기록을 작성할 때 값이 남아있지 않도록) */
            const hardnessDirectInput = document.getElementById('hardnessDirectInput');
            if (hardnessDirectInput) { hardnessDirectInput.value = ''; hardnessDirectInput.style.display = 'none'; }
            [
                ['.hardness-btn', '50'],
                ['.extruder-segment-btn', '압출기 1호'],
                ['.post-segment-btn', '바로커팅'],
                ['.qtex-btn', '큐텍스 1호'],
                ['.jig-pos-btn', '상']
            ].forEach(([selector, value]) => {
                const btn = document.querySelector(`${selector}[data-value="${value}"]`);
                if (btn) btn.click();
            });

            resetBlend('material', 0);
            resetBlend('additive', 0);

            clearImportedMix();
            clearMixProduct();
        }

        /* 편집 진입 시 기존 기록(log)의 값으로 폼을 채운다.
           resetForm()으로 완전히 비운 뒤에 호출되는 걸 전제로 한다.
           버튼식 선택 항목(경도/설비/후가공/큐텍스/지그위치)은 실제 버튼을 클릭시켜
           기존 토글 로직(시각 효과 + hidden input 반영)을 그대로 재사용한다. */
        function populateFormFromLog(log) {
            const d = log.detail || {};

            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = (val !== undefined && val !== null) ? val : '';
            };
            const selectSegment = (selector, value) => {
                const btn = document.querySelector(`${selector}[data-value="${value}"]`);
                if (btn) { btn.click(); return true; }
                return false;
            };

            if (log.type === '압출') {
                setVal('companyName', d.업체명);
                setVal('productName', d.제품명);
                setVal('moldInnerDia', d.금형내경);
                setVal('moldOuterDia', d.금형외경);
                setVal('innerDia', d.내경);
                setVal('outerDia', d.외경);
                setVal('lengthVal', d.길이);
                setVal('shrinkageRate', d.수축률);
                setVal('dimensionValue', d.치수값);

                const hardnessVal = d.경도 || '50';
                if (!selectSegment('.hardness-btn', hardnessVal)) {
                    selectSegment('.hardness-btn', 'direct');
                    const directInput = document.getElementById('hardnessDirectInput');
                    if (directInput) {
                        directInput.value = hardnessVal;
                        directInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }

                selectSegment('.extruder-segment-btn', d.사용설비 || '압출기 1호');
                setVal('extrudeTemp', d.온도);
                setVal('extrudeSpeed', d.속도);
                setVal('feedSpeed', d.투입속도);
                setVal('feedDecel', d.다량감속);
                setVal('feedReverse', d.역회전);
                setVal('feedSingleSpeed', d.싱글속도);

                const post = d.후가공 || {};
                const postType = post.type || '바로커팅';
                selectSegment('.post-segment-btn', postType);
                if (postType === '바로커팅') {
                    setVal('cutSetLength', post.설정길이);
                    setVal('cutBackSpeed', post.후진속도);
                    setVal('cutRollerPress', post.롤러누름);
                    setVal('cutHotHandling', post.뜨거울때);
                } else if (postType === '롤 작업') {
                    selectSegment('.qtex-btn', post.큐텍스 || '큐텍스 1호');
                    setVal('jigSize', post.지그크기);
                    setVal('jigLengthSetting', post.길이설정);
                    selectSegment('.jig-pos-btn', post.위치 || '상');
                    setVal('jigPercent', post.퍼센트);
                    setVal('jigPress', post.누름);
                } else if (postType === '직접 잘라요') {
                    setVal('manualCutLength', post.자른길이);
                }

                if (d.참고배합) {
                    const refLog = loadLogs().find(l => l.id === d.참고배합.배합기록ID);
                    importedMixRef = refLog || { id: d.참고배합.배합기록ID, createdAt: log.createdAt, detail: d.참고배합 };
                    renderImportedMixPreview(importedMixRef);
                }
            } else if (log.type === '배합') {
                setVal('mixCompanyName', d.업체명);
                setVal('mixProductName', d.제품명);

                const materials = loadMaterials();
                (d.원료 || []).forEach(m => {
                    if (!m.이름) return;
                    if (materials.includes(m.이름)) blendState.material.selected.add(m.이름);
                    else blendState.material.custom.push(m.이름);
                    blendState.material.values[m.이름] = m.중량;
                });
                renderBlendChips('material');
                renderBlendCustomList('material');
                renderBlendValues('material');

                const additives = loadAdditives();
                (d.첨가제 || []).forEach(a => {
                    if (!a.이름) return;
                    if (additives.includes(a.이름)) blendState.additive.selected.add(a.이름);
                    else blendState.additive.custom.push(a.이름);
                    blendState.additive.values[a.이름] = a.투입비율;
                });
                renderBlendChips('additive');
                renderBlendCustomList('additive');
                renderBlendValues('additive');
            }

            (log.images || []).forEach(src => addImageToGallery(src));
            setVal('workMemo', log.memo);
        }

        function fieldVal(id) {
            const el = document.getElementById(id);
            return el ? el.value.trim() : '';
        }

        async function submitForm() {
            const processType = document.getElementById('processStep').value;
            const workTime = document.getElementById('workTime').value;
            const createdAt = workTime ? new Date(workTime).toISOString() : new Date().toISOString();
            const memo = document.getElementById('workMemo') ? document.getElementById('workMemo').value.trim() : '';

            let title = '';
            let subtitle = '';
            let detail = {};

            if (processType === '압출') {
                const extruder = document.getElementById('extruderType').value;
                const company = fieldVal('companyName');
                const product = fieldVal('productName');
                const speed = fieldVal('extrudeSpeed');
                const specInnerDia = fieldVal('innerDia');
                const specOuterDia = fieldVal('outerDia');
                const specLength = fieldVal('lengthVal');

                const titleParts = [company, product].filter(Boolean);
                title = titleParts.length > 0 ? titleParts.join(' ') : (extruder || '압출 작업');

                const specParts = [specInnerDia, specOuterDia, specLength].filter(Boolean);
                subtitle = specParts.length > 0 ? specParts.join('*') : '스펙 미입력';

                const postProcessStep = document.getElementById('postProcessStep').value;
                const postDetail = { type: postProcessStep };
                if (postProcessStep === '바로커팅') {
                    Object.assign(postDetail, {
                        설정길이: fieldVal('cutSetLength'),
                        후진속도: fieldVal('cutBackSpeed'),
                        롤러누름: fieldVal('cutRollerPress'),
                        뜨거울때: fieldVal('cutHotHandling')
                    });
                } else if (postProcessStep === '롤 작업') {
                    Object.assign(postDetail, {
                        큐텍스: document.getElementById('qtexSelection').value,
                        지그크기: fieldVal('jigSize'),
                        길이설정: fieldVal('jigLengthSetting'),
                        위치: document.getElementById('jigPosition').value,
                        퍼센트: fieldVal('jigPercent'),
                        누름: fieldVal('jigPress')
                    });
                } else if (postProcessStep === '직접 잘라요') {
                    Object.assign(postDetail, {
                        자른길이: fieldVal('manualCutLength')
                    });
                }

                detail = {
                    업체명: company,
                    제품명: product,
                    금형내경: fieldVal('moldInnerDia'),
                    내경: fieldVal('innerDia'),
                    금형외경: fieldVal('moldOuterDia'),
                    외경: fieldVal('outerDia'),
                    길이: fieldVal('lengthVal'),
                    수축률: fieldVal('shrinkageRate'),
                    치수값: fieldVal('dimensionValue'),
                    경도: document.getElementById('hardnessValue').value,
                    사용설비: extruder,
                    온도: fieldVal('extrudeTemp'),
                    속도: speed,
                    투입속도: fieldVal('feedSpeed'),
                    다량감속: fieldVal('feedDecel'),
                    역회전: fieldVal('feedReverse'),
                    싱글속도: fieldVal('feedSingleSpeed'),
                    후가공: postDetail,
                    참고배합: importedMixRef ? {
                        배합기록ID: importedMixRef.id,
                        업체명: importedMixRef.detail.업체명 || '',
                        제품명: importedMixRef.detail.제품명 || '',
                        원료: importedMixRef.detail.원료 || [],
                        첨가제: importedMixRef.detail.첨가제 || [],
                        총원료중량: importedMixRef.detail.총원료중량 || 0
                    } : null
                };
            } else if (processType === '배합') {
                const materialNames = getBlendItemNames('material');
                const additiveNames = getBlendItemNames('additive');
                const totalKg = getTotalMaterialKg();

                const materials = materialNames.map(name => ({ 이름: name, 중량: (blendState.material.values[name] || '').toString().trim() }));
                const additives = additiveNames.map(name => {
                    const dose = (blendState.additive.values[name] || '').toString().trim();
                    const doseNum = parseFloat(dose);
                    const computed = !isNaN(doseNum) ? Math.round(doseNum * totalKg * 100) / 100 : '';
                    return { 이름: name, 투입비율: dose, 예상투입량: computed };
                });

                title = materialNames.length > 0 ? materialNames.join(' + ') : '배합 작업';
                subtitle = `총 ${totalKg}kg`;

                detail = {
                    업체명: fieldVal('mixCompanyName'),
                    제품명: fieldVal('mixProductName'),
                    원료: materials,
                    총원료중량: totalKg,
                    첨가제: additives
                };
            } else {
                // 프레스는 준비중 공정이라 저장하지 않음
                return;
            }

            const isEditing = !!editingLogId;
            const submitBtn = document.getElementById('submitLogBtn');
            const originalBtnText = submitBtn ? submitBtn.textContent : '';
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = isEditing ? '수정 중...' : '저장 중...'; }

            const payload = {
                type: processType,
                created_at: createdAt,
                title,
                subtitle,
                images: capturedImages.slice(),
                memo,
                detail
            };

            const { error } = isEditing
                ? await sb.from('work_logs').update(payload).eq('id', editingLogId)
                : await sb.from('work_logs').insert(payload);

            if (error) {
                if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
                alert((isEditing ? '수정 실패' : '저장 실패') + ': 인터넷 연결을 확인하고 다시 시도해주세요.\n(' + error.message + ')');
                return;
            }

            await refreshLogsCache();
            logsLoaded = true;

            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalBtnText; }
            editingLogId = null;

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]';
            modal.innerHTML = `
                <div class="bg-white rounded-[20px] w-[300px] p-6 shadow-xl flex flex-col items-center animate-[scaleUp_0.2s_ease-out]">
                    <div class="w-14 h-14 bg-toss-blueLight rounded-full flex items-center justify-center text-toss-blue mb-4">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${isEditing ? '수정 완료' : '저장 완료'}</h3>
                    <p class="text-toss-sub text-center text-sm mb-6">작업 기록이<br>성공적으로 ${isEditing ? '수정' : '저장'}되었습니다.</p>
                    <button id="modalConfirmBtn" class="w-full bg-toss-blue text-white font-bold py-4 rounded-xl active:bg-blue-600 transition-colors">
                        확인
                    </button>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                modal.remove();
                navigateTo('listView');
            });
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</body>
</html>
